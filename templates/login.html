<!DOCTYPE html>
<html>
<head>
  <title>Hospital Ops - Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; background: #0f172a; display: flex; align-items: center; justify-content: center; height: 100vh; }
    .card { background: #1e293b; padding: 2.5rem; border-radius: 16px; width: 360px; border: 1px solid #334155; }
    h1 { color: #38bdf8; font-size: 1.4rem; margin-bottom: 0.3rem; }
    p { color: #94a3b8; font-size: 0.85rem; margin-bottom: 1.5rem; }
    label { color: #cbd5e1; font-size: 0.85rem; display: block; margin-bottom: 0.3rem; }
    input { width: 100%; padding: 0.65rem 1rem; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f1f5f9; font-size: 0.95rem; margin-bottom: 1rem; }
    button { width: 100%; padding: 0.75rem; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; }
    .error { color: #f87171; font-size: 0.85rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hospital Ops</h1>
    <p>Real-time hospital operations dashboard</p>
    {% if form.errors %}<p class="error">Invalid username or password.</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      <label>Username</label>
      <input type="text" name="username" autofocus>
      <label>Password</label>
      <input type="password" name="password">
      <button type="submit">Sign In</button>
    </form>
  </div>
</body>
</html>
